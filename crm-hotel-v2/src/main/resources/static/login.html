<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso del personal · Hotel 3 Estrellas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="pagina-login">
  <main class="tarjeta login-caja p-4 p-md-5">
    <p class="text-center fs-1 mb-0"></p>
    <h1 class="h4 text-center mb-1">Acceso del personal</h1>
    <p class="ayuda text-center mb-4">Hotel 3 Estrellas · Administración</p>

    <div id="aviso" class="alert" hidden></div>

    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <input id="username" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" required>
      </div>
      <button class="btn btn-azul w-100" type="submit">Entrar</button>
    </form>

    <a href="index.html" class="d-block text-center mt-4 small">← Volver al sitio del hotel</a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const aviso = document.getElementById('aviso');
    if (params.has('error')) {
      aviso.className = 'alert alert-danger';
      aviso.textContent = 'Usuario o contraseña incorrectos.';
      aviso.hidden = false;
    } else if (params.has('logout')) {
      aviso.className = 'alert alert-success';
      aviso.textContent = 'Tu sesión se cerró correctamente.';
      aviso.hidden = false;
    }
  </script>
</body>
</html>
